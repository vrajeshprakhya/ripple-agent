name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install ngspice
        # The ngspice tests skip without it; installing it makes them run for real,
        # including the closed-form checks and the hostile-netlist tests.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ngspice

      - name: Test
        # The suite is offline by design, so no OpenRouter key is configured
        # here. A key in CI would mean every push spends real credit.
        run: python -m pytest tests -q
